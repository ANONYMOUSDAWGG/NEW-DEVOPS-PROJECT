name: Microservices CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, product-service, order-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          cd ${{ matrix.service }}
          pytest

  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build user-service image
        run: docker build -t user-service:${{ github.run_number }} ./user-service

      - name: Build product-service image
        run: docker build -t product-service:${{ github.run_number }} ./product-service

      - name: Build order-service image
        run: docker build -t order-service:${{ github.run_number }} ./order-service
