services:

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "5001:5001"
    networks:
      - microservices-net

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5002:5002"
    networks:
      - microservices-net

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5003:5003"
    environment:
      - USER_SERVICE_URL=http://user-service:5001
      - PRODUCT_SERVICE_URL=http://product-service:5002
    depends_on:
      - user-service
      - product-service
    networks:
      - microservices-net

networks:
  microservices-net:
    driver: bridge
